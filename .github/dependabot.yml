version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: tuesday
      time: "06:43"
      timezone: Asia/Seoul
    groups:
      github-actions-updates:
        patterns:
          - "*"
    labels:
      - Task
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: thursday
      time: "06:11"
      timezone: Asia/Seoul
    groups:
      screenshot-image-updates:
        patterns:
          - "*"
    labels:
      - Task
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
