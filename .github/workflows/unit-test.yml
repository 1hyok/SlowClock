name: Unit Test

# PR 에서는 변경 모듈과 역의존 모듈, main 에서는 전체 unit test 를 실행한다:
#   - node --test .github/scripts/*.test.mjs : 배포 판단 스크립트·워크플로 정책 회귀 가드.
#   - testDebugUnitTest : 모든 Android 모듈의 JVM 단위 테스트.
#   - :app:compileDebugAndroidTestKotlin : production/androidTest 변경 시 계측 소스셋 컴파일 가드.
#     계측 테스트 자체는 에뮬레이터가 필요해 CI 에서 돌리지 않는다.
# lint.yml 과 setup 이 거의 동일하지만 분리 — lint 실패가 test 결과를 가리지 않도록 fail-fast 독립.

# PR 검증은 pr-validation.yml 이 한 번에 부르고, 이 워크플로의 job check 를
# 브랜치 보호에서 required 로 직접 요구한다. concurrency 는 진입점에서 PR 단위로 건다.
#
# 트리거를 workflow_call 하나로 두는 것이 요점이다 — on: pull_request 를 함께 남기면
# 같은 검증과 동일한 이름의 check 가 PR 마다 두 벌씩 돈다.
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: false
        default: 0
        type: number
      run_validation:
        description: "false 이면 required check 이름을 유지한 채 무거운 검증을 건너뜀"
        required: false
        default: true
        type: boolean
      run_node_tests:
        description: "GitHub Actions 정책 Node 테스트 실행 여부"
        required: false
        default: true
        type: boolean
      gradle_tasks:
        description: "신뢰된 영향도 계산기가 만든 Gradle task 목록"
        required: false
        default: "testDebugUnitTest :app:compileDebugAndroidTestKotlin"
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-test:
    name: Run Unit Tests
    if: inputs.run_validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run deployment script tests
        if: inputs.run_node_tests
        run: node --test .github/scripts/*.test.mjs

      - name: Set up JDK 21
        if: inputs.gradle_tasks != ''
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        if: inputs.gradle_tasks != ''
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        if: inputs.gradle_tasks != ''
        uses: ./.github/actions/setup-ci-config

      - name: Run affected unit tests and androidTest compile guard
        if: inputs.gradle_tasks != ''
        env:
          GRADLE_TASKS: ${{ inputs.gradle_tasks }}
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --continue --parallel --build-cache

      # 실패한 테스트의 HTML/XML 리포트를 PR artifact 로 보존 — CI 로그에서 stack trace 추적이 빠름.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest
            **/build/test-results/testDebugUnitTest
          # 표준 보관 기간 7일 — 리포트·디버깅용 artifact 는 이 값 하나로 통일한다.
          retention-days: 7
