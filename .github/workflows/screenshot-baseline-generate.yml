name: Generate Screenshot Baselines

# PR 의 *ScreenshotTest.kt 가 선언한 Preview/상태만 CI 표준 이미지에서 다시 렌더한다.
# `screenshot-baseline` 라벨이 pull_request 권한 경계에서 정확한 PR head 실행을 요청한다.
# 이 비권한 워크플로는 쓰기 토큰 없이 경로 목록과 PNG blob 만 넘긴다.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: screenshot-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.label.name == 'screenshot-baseline' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    name: Render and validate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone exact PR head without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve affected screenshot modules
        id: impact
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files_json="$RUNNER_TEMP/pull-request-files.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$files_json"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node .github/scripts/classify-documentation-changes.mjs \
            "$CHANGED_FILES" < "$files_json" > /dev/null
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node .github/scripts/resolve-pr-impact.mjs "$files_json" \
            >> "$GITHUB_OUTPUT"
          if ! grep -q '^screenshot_required=true$' "$GITHUB_OUTPUT"; then
            echo "::error::이 PR의 영향 범위에는 생성할 screenshot baseline이 없습니다"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build CI screenshot image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.screenshot
          platforms: linux/amd64
          tags: slowclock-screenshot:latest
          load: true
          cache-from: type=gha,scope=screenshot
          cache-to: type=gha,scope=screenshot,mode=max

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Generate then validate affected screenshot baselines
        env:
          SCREENSHOT_MODULES: ${{ steps.impact.outputs.screenshot_modules }}
        run: |
          read -r -a modules <<< "$SCREENSHOT_MODULES"
          update_tasks=()
          validate_tasks=()
          for module in "${modules[@]}"; do
            update_tasks+=("${module}:updateScreenshotTest")
            validate_tasks+=("${module}:validateScreenshotTest")
          done
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/workspace \
            -v "$HOME/.gradle":/root/.gradle \
            -w /workspace \
            slowclock-screenshot:latest \
            ./gradlew "${update_tasks[@]}" --rerun --no-daemon --console=plain
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/workspace \
            -v "$HOME/.gradle":/root/.gradle \
            -w /workspace \
            slowclock-screenshot:latest \
            ./gradlew "${validate_tasks[@]}" --no-daemon --console=plain

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$HOME/.gradle"

      # 패키징 대상도 생성 lane 과 같아야 한다.
      - name: Package baseline-only PNG blobs
        env:
          SCREENSHOT_MODULES: ${{ steps.impact.outputs.screenshot_modules }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/screenshot-baseline"
          mkdir -p "$artifact/blobs"

          read -r -a modules <<< "$SCREENSHOT_MODULES"
          baseline_paths=()
          for module in "${modules[@]}"; do
            module_path="${module#:}"
            baseline_paths+=("${module_path//:/\/}/src/screenshotTestDebug/reference")
          done
          git add -A -- "${baseline_paths[@]}"
          ARTIFACT_DIR="$artifact" node <<'NODE'
          const childProcess = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const artifact = process.env.ARTIFACT_DIR;
          const raw = childProcess.execFileSync(
            'git',
            ['diff', '--cached', '--name-only', '--no-renames', '-z'],
            { encoding: null },
          );
          const paths = raw.toString('utf8').split('\0').filter(Boolean);
          const files = paths.map((changedPath, index) => {
            if (!fs.existsSync(changedPath)) {
              return { path: changedPath, action: 'delete' };
            }
            fs.copyFileSync(changedPath, path.join(artifact, 'blobs', `${index}.png`));
            return { path: changedPath, action: 'upsert' };
          });
          fs.writeFileSync(path.join(artifact, 'files.json'), `${JSON.stringify(files)}\n`);
          NODE

          jq -n \
            --arg branch "$TARGET_BRANCH" \
            --arg headSha "$TARGET_SHA" \
            --argjson pullRequest "$TARGET_PR" \
            --argjson sourceRunId "$GITHUB_RUN_ID" \
            '{branch: $branch, headSha: $headSha, pullRequest: $pullRequest, sourceRunId: $sourceRunId}' \
            > "$artifact/metadata.json"

          changed=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "생성된 baseline 변경: ${changed}개"
          git diff --cached --name-status

      - name: Upload baseline blobs for privileged validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-baseline-artifact
          path: ${{ runner.temp }}/screenshot-baseline/
          if-no-files-found: error
          # 예외: job 간 전송용 — 소비하는 job 이 같은 run 안에서 끝나므로 1일이면 족하다 (#1400).
          retention-days: 1
