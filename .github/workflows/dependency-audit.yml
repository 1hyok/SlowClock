name: Android Dependency Audit

# Claude Code 루틴보다 먼저 기계적 증거를 만든다.
# GitHub schedule은 UTC이며 정각 부하를 피하도록 월요일 06:17 KST에 실행한다.
on:
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:
    inputs:
      publish_issues:
        description: "감사 결과로 GitHub 이슈를 생성·갱신"
        required: true
        default: false
        type: boolean

concurrency:
  group: android-dependency-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Collect and verify dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPORT_DIR: build/reports/dependency-audit
    steps:
      - name: Clone default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      # 의존성 해석과 컴파일·테스트만 하므로 실서비스 값이 필요 없다 — PR 검증과 같은 stub 설정을 쓴다.
      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run dependency audit script tests
        run: node --test .github/scripts/*.test.mjs

      - name: Collect resolved Gradle dependency graphs
        run: |
          mkdir -p "$REPORT_DIR/resolved"
          : > "$REPORT_DIR/resolution-status.txt"

          run_report() {
            name="$1"
            shift
            set +e
            ./gradlew "$@" --console=plain > "$REPORT_DIR/resolved/$name.txt" 2>&1
            status=$?
            set -e
            # dependencies 보고서는 일부 해석 실패에도 exit 0 을 반환한다.
            if [ "$status" -eq 0 ] && grep -q ' FAILED' "$REPORT_DIR/resolved/$name.txt"; then
              status=1
            fi
            printf '%s=%s\n' "$name" "$status" >> "$REPORT_DIR/resolution-status.txt"
          }

          # 앱 런타임뿐 아니라 별도 해석되는 App Distribution, ktlint, UTP 및 included build도 감사한다.
          run_report root-build-environment buildEnvironment
          run_report app-build-environment :app:buildEnvironment
          run_report app-debug-runtime :app:dependencies --configuration debugRuntimeClasspath
          run_report app-configurations :app:dependencies
          run_report convention-compile -p build-logic :convention:dependencies --configuration compileClasspath

      - name: Run current SDK and JVM compatibility gate
        id: compatibility
        continue-on-error: true
        run: |
          set +e
          ./gradlew assembleDebug testDebugUnitTest \
            --continue --parallel --console=plain > "$REPORT_DIR/compatibility.log" 2>&1
          status=$?
          set -e
          printf '{"exitCode":%s}\n' "$status" > "$REPORT_DIR/compatibility-status.json"
          tail -n 200 "$REPORT_DIR/compatibility.log"
          exit "$status"

      - name: Collect Maven metadata and OSV evidence
        run: |
          node .github/scripts/collect-dependency-audit.mjs \
            --root . \
            --resolved-report "$REPORT_DIR/resolved/root-build-environment.txt" \
            --resolved-report "$REPORT_DIR/resolved/app-build-environment.txt" \
            --resolved-report "$REPORT_DIR/resolved/app-debug-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/app-configurations.txt" \
            --resolved-report "$REPORT_DIR/resolved/convention-compile.txt" \
            --resolution-status "$REPORT_DIR/resolution-status.txt" \
            --compatibility-status "$REPORT_DIR/compatibility-status.json" \
            --output "$REPORT_DIR/dependency-audit.json" \
            --summary "$REPORT_DIR/dependency-audit.md"

      - name: Add audit to job summary
        run: cat "$REPORT_DIR/dependency-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update actionable issues
        if: github.event_name == 'schedule' || inputs.publish_issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-dependency-audit-issues.mjs "$REPORT_DIR/dependency-audit.json"

      - name: Upload machine-readable audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-dependency-audit
          path: ${{ env.REPORT_DIR }}
          # 예외: 주간 감사 증거 — 스케줄 주기가 7일이라 표준 7일이면 다음 실행 시점에 직전 회차가
          # 만료돼 회차 간 비교가 끊긴다. 한 회차가 겹치도록 14일로 둔다 (#1400).
          retention-days: 14

      - name: Fail when current compatibility gate failed
        if: steps.compatibility.outcome == 'failure'
        run: exit 1

      - name: Remove CI-only app configuration
        if: always()
        run: rm -f app/google-services.json
