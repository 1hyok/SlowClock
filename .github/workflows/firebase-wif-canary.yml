name: Firebase WIF Canary

# release-distribution.yml 과 같은 WIF 경로를 main 머지 없이 수동으로 검증하는 canary 다.
# Firebase App Distribution 업로드를 실제 수행하므로 보호 Environment 승인 뒤에만 움직인다.
on:
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: "포함 이슈 번호 (#850 형식)"
        required: true
        default: "#35"
        type: string
      release_notes:
        description: "릴리스 노트 문장 (여러 개는 ; 로 구분)"
        required: true
        default: "WIF ADC 인증으로 Firebase App Distribution 업로드 확인"
        type: string
      confirm_upload:
        description: "보호 Environment 승인 뒤 실제 canary APK를 업로드합니다"
        required: true
        default: false
        type: boolean

# release-distribution.yml 과 같은 group — 업로드 대상 Firebase 앱이 하나다. 한쪽만 바꾸면
# 두 러너가 같은 앱에 동시 업로드한다 (#995).
concurrency:
  group: firebase-app-distribution-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard deployable ref and explicit upload confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Restrict canary to deployable branches
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          case "$SELECTED_REF" in
            refs/heads/main) ;;
            *)
              echo "::error::WIF canary는 main에서만 실행할 수 있습니다."
              exit 1
              ;;
          esac

          if [ "$CONFIRM_UPLOAD" != "true" ]; then
            echo "::error::실제 Firebase canary 업로드 확인이 필요합니다."
            exit 1
          fi

  canary:
    name: Build signed APK and canary-upload with WIF
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-distribution
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      # google-github-actions/auth가 ADC 파일을 안전하게 만들려면 checkout이 먼저 실행돼야 한다.
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Firebase release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-wif-canary-release-notes.txt
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/render-distribution-release-notes.sh "$RELEASE_NOTES_FILE"
          cat "$RELEASE_NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up release build configuration
        id: release_config
        uses: ./.github/actions/setup-release-config
        with:
          require: >-
            GOOGLE_SERVICES_JSON_B64
            RELEASE_STORE_FILE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          release-store-file-b64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          release-store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          compose-local-properties: 'true'

      # public 저장소이므로 signed APK를 Actions artifact로 게시하거나 job 사이에 전달하지 않는다.
      - name: Build signed release APK without Google credentials
        id: release_apk
        run: |
          ./gradlew assembleRelease --no-daemon

          mapfile -t apk_files < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::업로드할 release APK가 정확히 1개여야 합니다."
            exit 1
          fi
          bash scripts/verify-release-apk.sh "${apk_files[0]}"
          echo "path=${apk_files[0]}" >> "$GITHUB_OUTPUT"
          node .github/scripts/verify-release-attestation.mjs \
            digest "${apk_files[0]}" "$GITHUB_OUTPUT"

      - name: Verify WIF configuration is set
        env:
          GCP_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.GCP_FIREBASE_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          missing=""
          [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "$GCP_FIREBASE_SERVICE_ACCOUNT" ] && missing="$missing GCP_FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::필수 WIF 설정 누락:$missing"
            exit 1
          fi

      - name: Attest the exact signed APK
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.release_apk.outputs.path }}
          show-summary: false

      - name: Verify provenance and attestation subject digest
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          EXPECTED_SHA256: ${{ steps.release_apk.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK_PATH: ${{ steps.release_apk.outputs.path }}
        run: |
          verification_file="$RUNNER_TEMP/verified-release-attestation.json"
          gh attestation verify "$RELEASE_APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/firebase-wif-canary.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > "$verification_file"

          node .github/scripts/verify-release-attestation.mjs \
            verify "$RELEASE_APK_PATH" "$EXPECTED_SHA256" "$verification_file"

      # v3 immutable SHA. 이 단계 전에는 Google Cloud WIF credential이 발급되지 않는다.
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Upload the already-built APK to Firebase App Distribution
        env:
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          EXPECTED_SHA256: ${{ steps.release_apk.outputs.sha256 }}
          RELEASE_APK_PATH: ${{ steps.release_apk.outputs.path }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-wif-canary-release-notes.txt
        run: |
          node .github/scripts/verify-release-attestation.mjs \
            assert "$RELEASE_APK_PATH" "$EXPECTED_SHA256"

          ./gradlew appDistributionUploadRelease \
            --artifactPath="$RELEASE_APK_PATH" \
            --releaseNotesFile="$RELEASE_NOTES_FILE" \
            --no-daemon

          {
            echo "### Firebase WIF canary"
            echo "- result: PASS"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- artifact digest: \`sha256:$EXPECTED_SHA256\`"
            echo "- attestation: $ATTESTATION_URL"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release build configuration
        if: always()
        uses: ./.github/actions/cleanup-release-config
        with:
          keystore-path: ${{ steps.release_config.outputs.keystore-path }}
